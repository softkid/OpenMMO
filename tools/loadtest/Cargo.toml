[package]
name = "loadtest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "loadtest"
path = "src/main.rs"

[dependencies]
onlinerpg-shared = { path = "../../shared" }
tokio = { version = "1.0", features = ["full"] }
# rustls feature: without it `wss://` fails outright, matching agent-client's
# reasoning for the same feature flag.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
